[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-faq-assistant"
version = "0.1.0"
description = "Facts-only mutual fund FAQ assistant (RAG) for selected HDFC schemes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "groq>=0.11",
    "pyyaml>=6.0",
    "pysbd>=0.3.4",  # sentence splitting that handles decimals and abbreviations
]

[project.optional-dependencies]
# Phase 1: fetching and parsing the Groww pages
ingest = [
    "httpx>=0.27",
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
]
# Phase 2: embeddings, vector store, keyword index (large: pulls in torch)
rag = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
]
# Optional: Pinecone as the vector store (VECTOR_STORE=pinecone)
pinecone = [
    "pinecone>=5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
