# Daily data refresh (implementation-plan.md, Phase 7).
#
# Every day at 10:00 IST (GitHub may start scheduled runs late), refresh the data:
# fetch the 5 Groww pages -> normalise -> parse -> quality gates -> chunk -> embed -> store a
# NEW index version -> retrieval eval on it -> make it live -> prune old versions.
# If any step fails, the previous version stays live and a GitHub issue is opened.
# No LLM calls: the Groq budget isn't used.
#
# Two modes, chosen by which secrets exist (chroma wins if both are configured):
#
#   chroma  PRODUCTION (Render + Chroma Cloud)                  -> CHROMA_* secrets
#           Builds the new version on this runner and writes it to Chroma Cloud; the
#           Render backend picks it up within INDEX_REFRESH_SECONDS. The 512 MB free
#           instance does no refresh work.
#             Chroma Cloud: CHROMA_API_KEY, CHROMA_TENANT, CHROMA_DATABASE
#             self-hosted:  CHROMA_HOST, CHROMA_PORT (443), CHROMA_SSL (true), CHROMA_AUTH_TOKEN
#
#   app     backend with a local index on a persistent disk     -> secret ADMIN_TOKEN +
#           repository variable APP_URL. Calls POST <APP_URL>/api/admin/refresh; the
#           deployed backend refreshes itself.

name: Daily data refresh

on:
  schedule:
    - cron: "30 4 * * *"  # 04:30 UTC = 10:00 IST
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "chroma mode only: re-activate this earlier index version instead of refreshing"
        required: false
        default: ""
      force:
        description: "Build a new version even if nothing changed"
        type: boolean
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false  # never interrupt a run that is switching versions

permissions:
  contents: read
  issues: write

env:
  APP_URL: ${{ vars.APP_URL }}
  ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
  VECTOR_STORE: chroma_remote
  CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
  CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
  CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}
  CHROMA_HOST: ${{ secrets.CHROMA_HOST }}
  # Unset secrets become empty strings; give number/boolean settings safe defaults.
  CHROMA_PORT: ${{ secrets.CHROMA_PORT || '443' }}
  CHROMA_SSL: ${{ secrets.CHROMA_SSL || 'true' }}
  CHROMA_AUTH_TOKEN: ${{ secrets.CHROMA_AUTH_TOKEN }}
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUTF8: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Choose the refresh mode
        id: mode
        run: |
          if [ -n "$CHROMA_API_KEY" ] || [ -n "$CHROMA_HOST" ]; then
            echo "mode=chroma" >> "$GITHUB_OUTPUT"; echo "Mode: shared ChromaDB (Chroma Cloud)"
          elif [ -n "$ADMIN_TOKEN" ] && [ -n "$APP_URL" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"; echo "Mode: app ($APP_URL)"
          else
            echo "::error::No refresh target configured. Production (Render + Chroma Cloud): set the CHROMA_API_KEY, CHROMA_TENANT and CHROMA_DATABASE secrets. Or, for a backend with a local index: the ADMIN_TOKEN secret and the APP_URL variable."
            exit 1
          fi

      # ================================================================ app mode
      - name: Refresh the deployed app's data
        if: ${{ steps.mode.outputs.mode == 'app' }}
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          if [ -n "$ROLLBACK_TO" ]; then
            echo "::error::rollback_to isn't supported in app mode. Run 'python -m app.ingest --activate $ROLLBACK_TO' in the backend's shell instead."
            exit 1
          fi
          endpoint="$APP_URL/api/admin/refresh"
          query=""; [ "$FORCE" = "true" ] && query="?force=true"
          # Start (retries cover a cold start: the machine auto-starts on the first request).
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -m 30 -o start.json -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer $ADMIN_TOKEN" "$endpoint$query" || true)
            [ "$code" = "202" ] && break
            echo "attempt $i: HTTP $code"; sleep 15
          done
          if [ "$code" != "202" ]; then
            echo "::error::Could not start the refresh (HTTP $code)"; cat start.json 2>/dev/null || true; exit 1
          fi
          jq . start.json
          # Poll until done (requests also keep the machine awake while it works).
          state=running
          for i in $(seq 1 80); do
            sleep 15
            curl -fsS -m 30 -H "Authorization: Bearer $ADMIN_TOKEN" "$endpoint" -o status.json || continue
            state=$(jq -r '.job.state' status.json)
            echo "state: $state"
            [ "$state" != "running" ] && break
          done
          jq -r '.job.summary // ""' status.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          case "$state" in
            succeeded|no_changes) echo "Refresh $state." ;;
            *) echo "::error::Refresh $state"; jq '.job.problems' status.json 2>/dev/null || true; exit 1 ;;
          esac

      # ================================================================ chroma mode
      - uses: actions/setup-python@v5
        if: ${{ steps.mode.outputs.mode == 'chroma' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache the embedding model
        if: ${{ steps.mode.outputs.mode == 'chroma' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5

      - name: Install
        if: ${{ steps.mode.outputs.mode == 'chroma' }}
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[ingest,rag]"

      - name: Roll back to an earlier version
        if: ${{ steps.mode.outputs.mode == 'chroma' && inputs.rollback_to }}
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: python -m app.ingest --activate "$ROLLBACK_TO" --summary "$GITHUB_STEP_SUMMARY"

      - name: Stage a new version (fetch, normalise, parse, gates, chunk, embed, store)
        id: stage
        if: ${{ steps.mode.outputs.mode == 'chroma' && !inputs.rollback_to }}
        continue-on-error: true  # retried below with browser rendering
        env:
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python -m app.ingest --stage --report --summary "$GITHUB_STEP_SUMMARY" $FORCE_FLAG

      - name: Retry with browser rendering (pages that need JavaScript)
        id: retry
        if: ${{ steps.mode.outputs.mode == 'chroma' && !inputs.rollback_to && steps.stage.outcome == 'failure' }}
        env:
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          python -m playwright install --with-deps chromium
          python -m app.ingest --stage --report --summary "$GITHUB_STEP_SUMMARY" $FORCE_FLAG

      - name: Pick the staged version
        id: staged
        if: ${{ steps.mode.outputs.mode == 'chroma' && !inputs.rollback_to }}
        run: |
          echo "version=${{ steps.stage.outputs.version || steps.retry.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "changed=${{ steps.stage.outputs.changed || steps.retry.outputs.changed }}" >> "$GITHUB_OUTPUT"

      - name: Quality gate - retrieval eval on the staged version
        if: ${{ steps.staged.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.staged.outputs.version }}
        run: python -m tests.eval.retrieval_eval --version "$VERSION"

      - name: Make the new version live
        if: ${{ steps.staged.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.staged.outputs.version }}
        run: python -m app.ingest --activate "$VERSION" --summary "$GITHUB_STEP_SUMMARY"

      - name: Delete old versions (keep the live one + 2 for rollback)
        if: ${{ steps.mode.outputs.mode == 'chroma' && !inputs.rollback_to }}
        run: python -m app.ingest --prune --keep 3 --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshots, parsed data and eval results
        if: ${{ always() && steps.mode.outputs.mode == 'chroma' }}
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/raw/
            data/parsed/
            data/facts.json
            backend/tests/eval/results/

      # ================================================================ alerts
      - name: Open or update a GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The daily data refresh on $(date -u +%F) failed. The previous index version is still live. Details: $RUN_URL"
          gh label create data-refresh --color B60205 --description "Daily data refresh" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label data-refresh --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Daily data refresh failed" --label data-refresh --body "$body"
          fi
