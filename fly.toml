# Fly.io configuration: https://fly.io/docs/reference/configuration/
#
# One machine with one persistent volume: the Chroma index, the chat database (SQLite) and
# the page snapshots live in /data and survive restarts and deploys. Run exactly ONE
# machine: each machine would have its own volume, so chats and data would diverge
# (the deploy workflow enforces `--ha=false` and `scale count 1`).
#
# Secrets (set by .github/workflows/fly-deploy.yml from GitHub secrets, or with
# `fly secrets set`): LLM_API_KEY (Groq), ADMIN_TOKEN (daily refresh).

app = 'rag-chatbot-falling-dew-2905'
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  VECTOR_STORE = 'chroma'
  PORT = '8080'
  LLM_MODEL = 'openai/gpt-oss-120b'
  INDEX_REFRESH_SECONDS = '300'
  CORS_ORIGINS = 'https://rag-chatbot-falling-dew-2905.fly.dev'

[[mounts]]
  source = 'rag_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25
    hard_limit = 50

  # First start on an empty volume fetches the pages and builds the index before the
  # server listens, hence the long grace period.
  [[http_service.checks]]
    grace_period = '180s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
