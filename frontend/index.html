<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Facts-only FAQ assistant for five HDFC Mutual Fund schemes." />
  <title>Fund Facts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232DD4BF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 10 12 4l9 6'/%3E%3Cpath d='M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to the question box</a>

  <div class="app" id="app">
    <!-- Sidebar (a drawer on small screens) -->
    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" data-icon="logo" aria-hidden="true"></span>
          <span class="brand-name">Fund Facts</span>
        </div>
        <button class="icon-btn only-mobile" id="close-drawer" type="button" aria-label="Close chats">
          <span data-icon="close" aria-hidden="true"></span>
        </button>
      </div>
      <button class="btn btn-primary new-chat" id="new-chat" type="button">
        <span data-icon="plus" aria-hidden="true"></span><span>New chat</span>
      </button>
      <h2 class="section-label" id="threads-label">Recent chats</h2>
      <nav class="thread-nav" aria-labelledby="threads-label">
        <ul class="thread-list" id="thread-list"></ul>
      </nav>
      <div class="sidebar-foot">
        <p class="foot-note">Answers come only from five Groww scheme pages.</p>
        <p class="status" id="service-status"><span class="dot" aria-hidden="true"></span><span>Checking service…</span></p>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- Main column -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="open-drawer" type="button" aria-label="Open chats" aria-controls="sidebar" aria-expanded="false">
          <span data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="topbar-title">
          <span class="brand-mark only-mobile" data-icon="logo" aria-hidden="true"></span>
          <h1 class="chat-title" id="chat-title">Fund Facts</h1>
        </div>
        <span class="scope-chip only-desktop"><span data-icon="shield" aria-hidden="true"></span><span>5 HDFC schemes</span></span>
        <span class="data-date" id="data-date" hidden><span data-icon="clock" aria-hidden="true"></span><span id="data-date-text"></span></span>
        <button class="icon-btn only-mobile" id="new-chat-mobile" type="button" aria-label="New chat">
          <span data-icon="plus" aria-hidden="true"></span>
        </button>
      </header>

      <div class="disclaimer" role="note">
        <span data-icon="alert" aria-hidden="true"></span>
        <span id="disclaimer-text">Facts-only. No investment advice.</span>
      </div>

      <section class="messages" id="messages" aria-label="Conversation" tabindex="-1">
        <div class="column" id="message-column"></div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="column">
          <div class="composer-warning" id="composer-warning" role="alert" hidden></div>
          <div class="composer-box">
            <label class="visually-hidden" for="composer-input">Your question</label>
            <textarea id="composer-input" rows="1" maxlength="2000"
              placeholder="Ask a factual question about HDFC mutual funds…"></textarea>
            <button class="send-btn" id="send-btn" type="submit" aria-label="Send question" disabled>
              <span data-icon="send" aria-hidden="true"></span>
            </button>
          </div>
          <div class="composer-foot">
            <p class="hint">Please don't share PAN, Aadhaar, account numbers, OTPs, email or phone numbers.</p>
            <p class="counter" id="char-counter" aria-live="off">0/500</p>
          </div>
        </div>
      </form>
    </main>
  </div>

  <!-- Screen-reader announcements for new replies -->
  <div class="visually-hidden" id="live-region" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
